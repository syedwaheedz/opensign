<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenSign</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0c0e'/%3E%3Crect x='6' y='9' width='20' height='13' rx='2' fill='none' stroke='%234f8cff' stroke-width='2.5'/%3E%3Crect x='12' y='24' width='8' height='2.5' rx='1' fill='%234f8cff'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0c0c0e">
<style>
  /* Dark theme. The accent colour is set per store (see applyBranding); silver is the restrained metallic touch. */
  :root { color-scheme:dark; --bg:#0c0c0e; --card:#151518; --text:#f4f4f6; --muted:#9a9aa6; --line:#2a2a30; --accent:#4f8cff; --metal:linear-gradient(135deg,#f5f6f8 0%,#aeb3bd 45%,#e8eaee 70%,#8b909b 100%); --ok:#3ecf8e; --bad:#ff5d6c; }
  * { box-sizing:border-box } body { margin:0; font:14px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--text) }
  header { display:flex; align-items:center; gap:24px; padding:0 20px; height:60px; background:var(--card); border-bottom:1px solid var(--line) }
  .brand { display:flex; align-items:center; gap:12px }
  .wordmark { font-size:19px; font-weight:700; letter-spacing:.01em } .who { color:var(--muted); font-size:12px; white-space:nowrap }
  .logo { height:40px; width:auto; mix-blend-mode:lighten } /* the logo file has a black background */
  .product { font-size:11px; letter-spacing:.22em; text-transform:uppercase; background:var(--metal); -webkit-background-clip:text; background-clip:text; color:transparent }
  nav { display:flex; gap:4px; flex:1; overflow-x:auto }
  nav button { background:none; border:0; padding:19px 12px; white-space:nowrap; color:var(--muted); cursor:pointer; font:inherit; border-bottom:2px solid transparent }
  nav button.on { color:var(--text); border-color:var(--accent) }
  main { max-width:1000px; margin:20px auto; padding:0 16px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap } .grow { flex:1 }
  button, input, select { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 10px }
  button { cursor:pointer } button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600 } button.primary:hover { filter:brightness(1.1) } button.danger { color:var(--bad) }
  h2 { margin:0 0 12px; font-size:15px } .muted { color:var(--muted) } small { color:var(--muted) }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--muted); margin-right:6px } .dot.on { background:var(--ok) }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px }
  .thumb { border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--card) }
  .thumb .pic { height:100px; background:#000; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px }
  .thumb img, .thumb video { width:100%; height:100%; object-fit:cover } .thumb .meta { padding:8px; font-size:12px; word-break:break-all }
  .switch { display:inline-flex; align-items:center; gap:8px; cursor:pointer }
  .switch input { appearance:none; width:38px; height:22px; border-radius:11px; background:var(--line); position:relative; padding:0; cursor:pointer; transition:.15s }
  .switch input::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:.15s }
  .switch input:checked { background:var(--ok) } .switch input:checked::after { left:18px }
  .wall { display:grid; gap:6px; margin-top:10px } .wall select { width:100%; min-width:0 }
  .days label { margin-right:6px; user-select:none } input[type=number] { width:70px } input[type=time] { padding:4px 6px }
  #login { max-width:340px; margin:14vh auto; text-align:center } #login .logo { height:84px; margin-bottom:8px } #login .row { text-align:left }
  button:disabled { opacity:.4; cursor:not-allowed; filter:grayscale(.4) }
  .badge { display:inline-block; font-size:11px; padding:1px 8px; border-radius:20px; border:1px solid var(--line); color:var(--muted) } .badge.ok { color:var(--ok); border-color:var(--ok) } .badge.warn { color:#f5b84c; border-color:#f5b84c }
  .pgrid { grid-template-columns:repeat(auto-fill,minmax(210px,1fr)) } .pcard { cursor:pointer } .pcard:hover { border-color:var(--accent) } .pcard .pic { height:150px }
  .warns { margin:10px 0 0; padding-left:18px } textarea { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 10px }
  main { max-width:1100px }
  .peditor { display:grid; grid-template-columns:380px 1fr; gap:12px; align-items:start } @media (max-width:900px) { .peditor { grid-template-columns:1fr } }
  .chips { display:flex; gap:6px; flex-wrap:wrap } .thumbrow { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px } .thumbrow img { width:64px; height:64px; object-fit:contain; background:#fff; border:2px solid var(--line); border-radius:6px; cursor:pointer } .thumbrow img.sel { border-color:var(--accent) }
  .pgrid2 { grid-template-columns:repeat(auto-fill,minmax(260px,1fr)) } input[type=range] { width:70%; padding:0 }
  footer { text-align:center; color:var(--muted); font-size:11px; padding:24px 0 32px; letter-spacing:.08em }
</style>
</head>
<body>
<div id="login" class="card" hidden>
  <div class="wordmark" style="font-size:28px;margin-bottom:6px">OpenSign</div>
  <h2 id="loginTitle">Sign in</h2>
  <p id="setupHint" class="muted" hidden>Welcome! Create the platform administrator for this server. From here you will create stores and give each store owner a login.</p>
  <form onsubmit="login(event)">
    <input id="lg" placeholder="Email or login name" autocomplete="username" style="width:100%" autofocus>
    <div class="row" style="margin-top:8px"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" class="grow">
    <button class="primary" id="loginBtn">Sign in</button></div>
  </form>
  <small id="loginErr" style="display:block;margin-top:8px"></small>
  <small id="forgot" style="display:block;margin-top:8px">Forgot your password? Ask your store owner. Store owners ask the platform administrator.</small>
</div>
<div id="app" hidden>
  <header>
    <div class="brand" id="brand"></div>
    <nav id="nav"></nav>
    <span class="who" id="who"></span>
    <button onclick="logout()">Sign out</button>
  </header>
  <main id="view"></main>
  <footer>POWERED BY OPENSIGN</footer>
</div>
<script src="/admin.js"></script>
<script src="/products.js"></script>
<script src="/poster-render.js"></script>
<script src="/posters.js"></script>
<script>
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TAB_LABELS = { platform: 'Platform', products: 'Products', posters: 'Posters', devices: 'Screens', media: 'Media', playlists: 'Playlists', layouts: 'Layouts', walls: 'Video walls', alerts: 'Alerts', reports: 'Reports', team: 'Team', settings: 'Settings' };
let ME = null, ORG = null; // who is signed in, and their store (null for a platform administrator with no store)
let token = localStorage.getItem('token'), tab = localStorage.getItem('tab');
/** Tabs this person may use: the store's tabs by role and feature, plus Platform for platform administrators. */
function availableTabs() {
  const t = [];
  if (ME.user.platform && !ME.org) t.push('platform');
  if (ME.org) {
    if (ME.org.features.catalog) t.push('products', 'posters');
    t.push('devices', 'media', 'playlists', 'layouts', 'walls', 'alerts', 'reports');
    if (ME.user.role === 'owner') t.push('team');
    t.push('settings');
  }
  if (ME.user.platform && ME.org) t.push('platform');
  return t;
}
let devices = [], media = [],  playlists = [], walls = [], layouts = [], alertNow = null, report = null, reportDays = 7, editing = null, timer;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

async function api(path, opts = {}) {
  const headers = { Authorization: 'Bearer ' + token };
  if (opts.body && !(opts.body instanceof FormData)) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.body); }
  const r = await fetch('/api' + path, { ...opts, headers });
  if (r.status === 401) { logout(); throw new Error('Unauthorized'); }
  const data = await r.json();
  if (!r.ok) { alert(data.error || 'Request failed'); throw new Error(data.error); }
  return data;
}
let setupRequired = false;
async function showLogin() {
  try { setupRequired = (await (await fetch('/api/auth/status')).json()).setupRequired; } catch {}
  document.title = 'OpenSign';
  $('#loginTitle').textContent = setupRequired ? 'Set up OpenSign' : 'Sign in';
  $('#setupHint').hidden = !setupRequired;
  $('#forgot').style.display = setupRequired ? 'none' : 'block'; // (the hidden attribute loses to display:block)
  $('#loginBtn').textContent = setupRequired ? 'Create administrator' : 'Sign in';
  $('#pw').placeholder = setupRequired ? 'Choose a password (8+ characters)' : 'Password';
  $('#login').hidden = false;
}
async function login(e) {
  e.preventDefault();
  const r = await fetch(setupRequired ? '/api/auth/setup' : '/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login: $('#lg').value, password: $('#pw').value }) });
  if (!r.ok) { $('#loginErr').textContent = (await r.json()).error || 'Wrong login or password'; return; }
  token = (await r.json()).token; localStorage.setItem('token', token); $('#pw').value = ''; $('#loginErr').textContent = ''; start();
}
function logout() {
  if (token) fetch('/api/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } }).catch(() => {});
  localStorage.removeItem('token'); token = null; ME = ORG = null; clearInterval(timer); $('#app').hidden = true; showLogin();
}
/** Store logo, name and accent colour. A store's branding is shown only to that store's people. */
function applyBranding() {
  ORG = ME.org;
  document.documentElement.style.setProperty('--accent', ORG?.accent || '#4f8cff');
  document.title = ORG ? `${ORG.name} Signage` : 'OpenSign';
  $('#brand').innerHTML = (ORG?.logoUrl ? `<img class="logo" src="${esc(ORG.logoUrl)}" alt="${esc(ORG.name)}">` : `<span class="wordmark">${esc(ORG?.name || 'OpenSign')}</span>`) + '<span class="product">Signage</span>';
  $('#who').textContent = ME.user.name + (ME.user.platform ? ' · platform admin' : '');
  if (ORG?.logoUrl) $('#favicon').href = ORG.logoUrl;
}
function buildNav() {
  $('#nav').innerHTML = availableTabs().map((t) => `<button data-tab="${t}">${TAB_LABELS[t]}</button>`).join('');
  document.querySelectorAll('#nav button').forEach((b) => b.onclick = () => { tab = b.dataset.tab; editing = null; localStorage.setItem('tab', tab); load(); });
}
async function load() {
  if (ME.org) [devices, media, playlists, walls, alertNow, layouts] = await Promise.all([api('/devices'), api('/media'), api('/playlists'), api('/walls'), api('/alert'), api('/layouts')]);
  if (tab === 'platform') await loadPlatform();
  if (tab === 'team') await loadTeam();
  if (tab === 'reports') report = await api('/reports/plays?days=' + reportDays);
  if (tab === 'products') await loadProducts();
  if (tab === 'posters') await loadPosters();
  render();
}
async function start() {
  try { ME = await api('/me'); } catch { return; }
  applyBranding();
  if (!availableTabs().includes(tab)) tab = availableTabs()[0]; // a stale or unknown saved tab must not blank the page
  $('#login').hidden = true; $('#app').hidden = false;
  buildNav();
  load(); clearInterval(timer);
  timer = setInterval(() => { if ((tab === 'devices' || tab === 'reports') && !document.activeElement.closest('#view')) load(); }, 15000);
}
function render() {
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  $('#view').innerHTML = { platform: renderPlatform, team: renderTeam, settings: renderSettings, products: renderProducts, posters: renderPosters, devices: renderDevices, media: renderMedia, playlists: renderPlaylists, walls: renderWalls, layouts: renderLayouts, alerts: renderAlerts, reports: renderReports }[tab]();
  if (typeof afterRender === 'function') afterRender(); // tabs that draw on a canvas do it here
}
const plOptions = (sel) => '<option value="">— none —</option>' + playlists.map((p) => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
const contentOptions = (sel) => plOptions(sel).replace('</option>', '</option>') + layouts.map((l) => `<option value="${l.id}" ${l.id === sel ? 'selected' : ''}>▦ ${esc(l.name)} (layout)</option>`).join('');

// ---- Screens ----
function renderDevices() {
  const now = Date.now();
  return `<div class="card"><h2>Add a screen</h2><div class="row">
    <input id="claimCode" placeholder="6-digit code shown on the TV" maxlength="6">
    <input id="claimName" placeholder="Screen name (e.g. Lobby)" class="grow">
    <button class="primary" onclick="claim()">Add</button></div></div>` +
    (devices.length ? '' : '<p class="muted">No screens yet. Open the OpenSign Player app on your TV, then type the 6-digit code it shows into the box above.</p>') +
    devices.map((d) => {
      if (!d.paired) return `<div class="card row"><span class="grow"><span class="dot"></span>Waiting to pair: <b>${d.pairingCode}</b> <small>${esc(d.model)}</small></span><button class="primary" onclick="quickClaim('${d.pairingCode}')">Add this screen</button><button class="danger" onclick="delDevice('${d.id}')">Remove</button></div>`;
      const online = d.lastSeen && now - d.lastSeen < 150000;
      return `<div class="card"><div class="row">
        <span class="grow"><span class="dot ${online ? 'on' : ''}"></span><b>${esc(d.name)}</b>
        <small>${online ? 'online' : d.lastSeen ? 'last seen ' + new Date(d.lastSeen).toLocaleString() : 'never connected'}${d.nowPlaying ? ' · playing: ' + esc(d.nowPlaying) : ''}</small></span>
        <button onclick="rename('${d.id}')">Rename</button><button onclick="refreshDevice('${d.id}')">Refresh</button><button class="danger" onclick="delDevice('${d.id}')">Remove</button></div>
        <div class="row" style="margin-top:10px"><span>Default content</span>
          <select onchange="setDefault('${d.id}', this.value)">${contentOptions(d.defaultPlaylistId)}</select>
          <button onclick="addSlot('${d.id}')">+ Schedule slot</button></div>
        ${d.schedule.map((s, i) => `<div class="row days" style="margin-top:8px">
          <select onchange="editSlot('${d.id}',${i},'playlistId',this.value)">${contentOptions(s.playlistId)}</select>
          <input type="time" value="${s.start}" onchange="editSlot('${d.id}',${i},'start',this.value)"> –
          <input type="time" value="${s.end}" onchange="editSlot('${d.id}',${i},'end',this.value)">
          ${DAYS.map((n, di) => `<label><input type="checkbox" ${s.days.includes(di) ? 'checked' : ''} onchange="toggleDay('${d.id}',${i},${di},this.checked)">${n}</label>`).join('')}
          <button class="danger" onclick="delSlot('${d.id}',${i})">✕</button></div>`).join('')}
        ${d.schedule.length ? '<small>Slots override the default playlist during their time window (first match wins; windows may cross midnight).</small>' : ''}
      </div>`;
    }).join('');
}
const dev = (id) => devices.find((d) => d.id === id);
const saveDev = async (d) => { await api('/devices/' + d.id, { method:'PUT', body: d }); load(); };
async function quickClaim(code) { const n = prompt('Give this screen a name (e.g. Lobby)'); if (n) { await api('/devices/claim', { method:'POST', body:{ code, name:n } }); load(); } }
async function claim() { await api('/devices/claim', { method:'POST', body:{ code: $('#claimCode').value, name: $('#claimName').value } }); load(); }
function rename(id) { const n = prompt('Screen name', dev(id).name); if (n) { dev(id).name = n; saveDev(dev(id)); } }
async function refreshDevice(id) { await api(`/devices/${id}/refresh`, { method:'POST' }); load(); }
async function delDevice(id) { if (confirm('Remove this screen?')) { await api('/devices/' + id, { method:'DELETE' }); load(); } }
function setDefault(id, v) { dev(id).defaultPlaylistId = v; saveDev(dev(id)); }
function addSlot(id) { if (!playlists.length && !layouts.length) return alert('Create a playlist first'); const d = dev(id); d.schedule.push({ playlistId: (playlists[0] || layouts[0]).id, days:[0,1,2,3,4,5,6], start:'09:00', end:'17:00' }); saveDev(d); }
function editSlot(id, i, k, v) { const d = dev(id); d.schedule[i][k] = v; saveDev(d); }
function toggleDay(id, i, day, on) { const d = dev(id), s = d.schedule[i]; s.days = on ? [...new Set([...s.days, day])] : s.days.filter((x) => x !== day); saveDev(d); }
function delSlot(id, i) { const d = dev(id); d.schedule.splice(i, 1); saveDev(d); }

// ---- Media ----
function renderMedia() {
  return `<div class="card"><h2>Upload</h2><div class="row">
    <input id="files" type="file" multiple accept="image/*,video/*"><button class="primary" onclick="uploadFiles()">Upload</button>
    </div>
    <div class="row" style="margin-top:10px"><input id="webName" placeholder="Name (optional)"><input id="webUrl" placeholder="Paste a YouTube, Instagram, Facebook, image, video or web page link" class="grow"><button onclick="addWeb()">Add link</button></div>
    <div class="row" style="margin-top:10px"><select id="wKind"><option value="text">Text slide</option><option value="ticker">Scrolling ticker</option><option value="clock">Clock</option></select>
      <input id="wText" placeholder="Message to show (not needed for a clock)" class="grow"><label>Background <input id="wBg" type="color" value="#0b1220"></label><label>Text <input id="wFg" type="color" value="#ffffff"></label><button onclick="addWidget()">Add</button></div>
    <small>Links need internet on the TV. Instagram and Facebook only show public posts; YouTube plays muted. Set how long each link plays in the playlist.</small></div>
    <div class="grid">${media.map((m) => `<div class="thumb"><div class="pic">${
      m.type === 'image' ? `<img src="${m.file ? '/media/' + m.file : esc(m.url)}" loading="lazy">` : m.type === 'video' ? `<video src="${m.file ? '/media/' + m.file : esc(m.url)}#t=0.5" preload="metadata" muted></video>` : `${m.provider === 'widget' ? '🧩 ' + m.widget.kind : '🌐 ' + (m.provider || 'web page')}`}</div>
      <div class="meta">${esc(m.name)}<br><small>${m.provider || m.type}${m.size ? ' · ' + (m.size / 1048576).toFixed(1) + ' MB' : ''}</small>
      <br><button class="danger" onclick="delMedia('${m.id}')">Delete</button></div></div>`).join('') || '<p class="muted">No media yet.</p>'}</div>`;
}
async function uploadFiles() {
  const f = $('#files').files; if (!f.length) return;
  const fd = new FormData(); for (const x of f) fd.append('files', x);
  await api('/media', { method:'POST', body: fd }); load();
}
async function addWidget() { await api('/media/widget', { method:'POST', body:{ kind: $('#wKind').value, text: $('#wText').value, bg: $('#wBg').value, fg: $('#wFg').value } }); load(); }
async function addWeb() { await api('/media/link', { method:'POST', body:{ name: $('#webName').value, url: $('#webUrl').value } }); load(); }
async function delMedia(id) { if (confirm('Delete this media? It is removed from all playlists.')) { await api('/media/' + id, { method:'DELETE' }); load(); } }

// ---- Video walls ----
function renderWalls() {
  const paired = devices.filter((d) => d.paired);
  return `<div class="card"><div class="row"><input id="wallName" placeholder="New video wall name" class="grow"><button class="primary" onclick="newWall()">Create</button></div>
    <small>A video wall joins several screens into one big display. All screens in a wall play the same playlist, each showing its own part of the picture. Turn it off to return the screens to their own playlists.</small></div>` +
    walls.map((w) => {
      const cells = [];
      for (let r = 0; r < w.rows; r++) for (let c = 0; c < w.cols; c++) {
        const m = w.members.find((x) => x.col === c && x.row === r);
        cells.push(`<select onchange="setCell('${w.id}',${c},${r},this.value)"><option value="">Empty (${c + 1},${r + 1})</option>${paired.map((d) => `<option value="${d.id}" ${m?.deviceId === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select>`);
      }
      return `<div class="card"><div class="row">
        <b class="grow">${esc(w.name)}</b>
        <label class="switch"><input type="checkbox" ${w.enabled ? 'checked' : ''} onchange="patchWall('${w.id}',{enabled:this.checked})"> ${w.enabled ? 'On' : 'Off'}</label>
        <button class="danger" onclick="delWall('${w.id}')">Delete</button></div>
        <div class="row" style="margin-top:10px">Layout <input type="number" min="1" max="8" value="${w.cols}" onchange="patchWall('${w.id}',{cols:+this.value})"> ×
          <input type="number" min="1" max="8" value="${w.rows}" onchange="patchWall('${w.id}',{rows:+this.value})"> <small>(columns × rows)</small>
          <span class="grow"></span>Playlist <select onchange="patchWall('${w.id}',{playlistId:this.value})">${plOptions(w.playlistId)}</select></div>
        <div class="wall" style="grid-template-columns:repeat(${w.cols},1fr)">${cells.join('')}</div>
        <small>Set a duration for every item (including videos) — screens stay in sync by following the playlist timing. Enabling needs a playlist.</small>
      </div>`;
    }).join('') || '<p class="muted">No video walls yet.</p>';
}
async function newWall() { await api('/walls', { method:'POST', body:{ name: $('#wallName').value } }); load(); }
async function patchWall(id, patch) { await api('/walls/' + id, { method:'PUT', body: patch }); load(); }
async function delWall(id) { if (confirm('Delete this video wall?')) { await api('/walls/' + id, { method:'DELETE' }); load(); } }
function setCell(id, col, row, deviceId) {
  const w = walls.find((x) => x.id === id);
  const members = w.members.filter((m) => !(m.col === col && m.row === row) && m.deviceId !== deviceId);
  if (deviceId) members.push({ deviceId, col, row });
  patchWall(id, { members });
}

// ---- Layouts (multi-zone) ----
const PRESETS = {
  'Full screen': [['Main', 0, 0, 100, 100]],
  'Main + bottom ticker': [['Main', 0, 0, 100, 85], ['Ticker', 0, 85, 100, 15]],
  'Main + right sidebar': [['Main', 0, 0, 75, 100], ['Sidebar', 75, 0, 25, 100]],
  'Split 50 / 50': [['Left', 0, 0, 50, 100], ['Right', 50, 0, 50, 100]],
  'Main + sidebar + ticker': [['Main', 0, 0, 75, 85], ['Sidebar', 75, 0, 25, 100], ['Ticker', 0, 85, 75, 15]],
  'Left ad + main': [['Ad', 0, 0, 25, 100], ['Main', 25, 0, 75, 100]],
  'Ad | video | ad': [['Left ad', 0, 0, 20, 100], ['Video', 20, 0, 60, 100], ['Right ad', 80, 0, 20, 100]],
  'Banner + main + ticker': [['Banner', 0, 0, 100, 12], ['Main', 0, 12, 100, 73], ['Ticker', 0, 85, 100, 15]],
  'Four quarters': [['Top left', 0, 0, 50, 50], ['Top right', 50, 0, 50, 50], ['Bottom left', 0, 50, 50, 50], ['Bottom right', 50, 50, 50, 50]],
};
const ZCOLORS = ['#2563eb', '#16a34a', '#d97706', '#9333ea', '#dc2626', '#0891b2', '#65a30d', '#db2777'];
function renderLayouts() {
  const l = layouts.find((x) => x.id === editing);
  if (!l) return `<div class="card"><h2>New layout</h2><div class="row"><input id="lyName" placeholder="Layout name" class="grow">
      <select id="lyPreset">${Object.keys(PRESETS).map((n) => `<option>${n}</option>`).join('')}</select><button class="primary" onclick="newLayout()">Create</button></div>
      <small>A layout splits the screen into zones; each zone plays its own playlist (e.g. promo video + news ticker + clock). Then pick the layout for a screen under Screens.</small></div>` +
    layouts.map((x) => `<div class="card row"><b class="grow">${esc(x.name)} <small>${x.zones.length} zone${x.zones.length > 1 ? 's' : ''}</small></b><button onclick="editing='${x.id}';render()">Edit</button><button class="danger" onclick="delLayout('${x.id}')">Delete</button></div>`).join('');
  return `<div class="card"><div class="row"><button onclick="editing=null;load()">← Back</button><input id="lyTitle" value="${esc(l.name)}" class="grow"><button class="primary" onclick="saveLayout()">Save</button></div></div>
    <div class="card"><div style="position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden">${l.zones.map((z, i) =>
      `<div style="position:absolute;left:${z.x}%;top:${z.y}%;width:${z.w}%;height:${z.h}%;background:${ZCOLORS[i % 8]}44;border:2px solid ${ZCOLORS[i % 8]};box-sizing:border-box;color:#fff;font-size:12px;padding:4px;overflow:hidden">${esc(z.name)}<br>${esc(playlists.find((p) => p.id === z.playlistId)?.name || 'no playlist')}</div>`).join('')}</div></div>
    ${l.zones.map((z, i) => `<div class="card"><div class="row"><b style="color:${ZCOLORS[i % 8]}">■</b><input value="${esc(z.name)}" onchange="zone(${i}).name=this.value;render()" class="grow">
      <select onchange="zone(${i}).playlistId=this.value||null;render()">${plOptions(z.playlistId)}</select>
      <button class="danger" onclick="removeZone(${i})">✕</button></div>
      <div class="row" style="margin-top:8px"><small>Left %</small><input type="number" min="0" max="95" value="${z.x}" onchange="zone(${i}).x=+this.value;render()">
      <small>Top %</small><input type="number" min="0" max="95" value="${z.y}" onchange="zone(${i}).y=+this.value;render()">
      <small>Width %</small><input type="number" min="5" max="100" value="${z.w}" onchange="zone(${i}).w=+this.value;render()">
      <small>Height %</small><input type="number" min="5" max="100" value="${z.h}" onchange="zone(${i}).h=+this.value;render()"></div></div>`).join('')}
    <div class="row"><button onclick="addZone()">+ Add zone</button><small>Zones may overlap; later zones draw on top. Use one video zone where possible – TVs have limited video decoders.</small></div>`;
}
const zone = (i) => layouts.find((x) => x.id === editing).zones[i];
function addZone() { const l = layouts.find((x) => x.id === editing); if (l.zones.length < 8) { l.zones.push({ name: 'Zone ' + (l.zones.length + 1), x: 10, y: 10, w: 40, h: 40, playlistId: null }); render(); } }
function removeZone(i) { const l = layouts.find((x) => x.id === editing); if (l.zones.length > 1) { l.zones.splice(i, 1); render(); } }
async function newLayout() {
  const zones = PRESETS[$('#lyPreset').value].map(([name, x, y, w, h]) => ({ name, x, y, w, h }));
  const l = await api('/layouts', { method:'POST', body:{ name: $('#lyName').value || $('#lyPreset').value, zones } });
  await load(); editing = l.id; render();
}
async function saveLayout() { const l = layouts.find((x) => x.id === editing); await api('/layouts/' + l.id, { method:'PUT', body:{ name: $('#lyTitle').value, zones: l.zones } }); editing = null; load(); }
async function delLayout(id) { if (confirm('Delete this layout? Screens using it lose that content.')) { await api('/layouts/' + id, { method:'DELETE' }); load(); } }

// ---- Alerts ----
function renderAlerts() {
  const paired = devices.filter((d) => d.paired);
  return `<div class="card"><h2>Emergency alert</h2>
    ${alertNow ? `<div class="row" style="background:${alertNow.color};color:#fff;padding:10px;border-radius:6px;margin-bottom:10px"><b class="grow">LIVE: ${esc(alertNow.message)}</b><span>until ${new Date(alertNow.until).toLocaleTimeString()}</span><button class="danger" onclick="clearAlert()">Clear now</button></div>` : '<p class="muted">No alert is showing.</p>'}
    <div class="row"><input id="alMsg" class="grow" placeholder="Message shown full-screen on the TVs, e.g. Please leave the building calmly"></div>
    <div class="row" style="margin-top:8px">Show for <input id="alMin" type="number" min="1" value="5"> minutes <label>Colour <input id="alColor" type="color" value="#c62828"></label></div>
    <div style="margin-top:8px"><b>Screens</b> <small>(none ticked = all screens)</small><div class="days">${paired.map((d) => `<label><input type="checkbox" class="alDev" value="${d.id}"> ${esc(d.name)}</label>`).join('') || '<small>No screens yet.</small>'}</div></div>
    <div class="row" style="margin-top:10px"><button class="primary" onclick="sendAlert()">Send alert now</button><small>Screens switch within a few seconds and go back to normal playback when it ends.</small></div></div>`;
}
async function sendAlert() { await api('/alert', { method:'POST', body:{ message: $('#alMsg').value, minutes: +$('#alMin').value, color: $('#alColor').value, deviceIds: [...document.querySelectorAll('.alDev:checked')].map((x) => x.value) } }); load(); }
async function clearAlert() { await api('/alert', { method:'DELETE' }); load(); }

// ---- Reports (proof of play) ----
const fmtSec = (n) => n >= 3600 ? (n / 3600).toFixed(1) + ' h' : n >= 60 ? Math.round(n / 60) + ' min' : n + ' s';
function renderReports() {
  if (!report) return '<p class="muted">Loading…</p>';
  const table = (rows, label) => `<table style="width:100%;border-collapse:collapse"><tr><th align="left">${label}</th><th align="right">Times shown</th><th align="right">Total time</th><th align="right">Last shown</th></tr>${rows.map((r) => `<tr style="border-top:1px solid var(--line)"><td>${esc(r.name)}</td><td align="right">${r.plays}</td><td align="right">${fmtSec(r.seconds)}</td><td align="right">${new Date(r.last).toLocaleString()}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Nothing played in this period yet.</td></tr>'}</table>`;
  return `<div class="card"><div class="row"><h2 class="grow" style="margin:0">Proof of play</h2>
    <select onchange="reportDays=+this.value;load()">${[1, 7, 30, 90].map((n) => `<option value="${n}" ${n === reportDays ? 'selected' : ''}>Last ${n} day${n > 1 ? 's' : ''}</option>`).join('')}</select>
    <button onclick="downloadCsv()">Download CSV</button></div>
    <small>Every item each screen actually showed, ${report.total} plays in this period. Use it as evidence for advertisers or compliance.</small></div>
    <div class="card"><h2>By content</h2>${table(report.byMedia, 'Content')}</div>
    <div class="card"><h2>By screen</h2>${table(report.byScreen, 'Screen')}</div>`;
}
async function downloadCsv() {
  const r = await fetch('/api/reports/plays.csv?days=' + reportDays, { headers: { Authorization: 'Bearer ' + token } });
  const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = `proof-of-play-${reportDays}d.csv`; a.click();
}

// ---- Playlists ----
function renderPlaylists() {
  const p = playlists.find((x) => x.id === editing);
  if (!p) return `<div class="card"><div class="row"><input id="plName" placeholder="New playlist name" class="grow"><button class="primary" onclick="newPlaylist()">Create</button></div></div>` +
    playlists.map((x) => `<div class="card row"><b class="grow">${esc(x.name)} <small>${x.items.length} items</small></b><button onclick="editing='${x.id}';render()">Edit</button><button class="danger" onclick="delPlaylist('${x.id}')">Delete</button></div>`).join('');
  return `<div class="card"><div class="row"><button onclick="editing=null;load()">← Back</button><input id="plTitle" value="${esc(p.name)}" class="grow"><button class="primary" onclick="savePlaylist()">Save</button></div></div>
    <div class="card" id="items">${p.items.map((it, i) => { const m = media.find((x) => x.id === it.mediaId); return `<div class="row" style="margin-bottom:6px">
      <span class="grow">${i + 1}. ${esc(m?.name || '(missing)')} <small>${m?.type || ''}</small></span>
      <input type="number" min="1" value="${it.duration}" onchange="editing_items()[${i}].duration=+this.value"> s${m?.type === 'video' ? ' <small>(video walls only; otherwise full length)</small>' : ''}
      <button onclick="moveItem(${i},-1)">↑</button><button onclick="moveItem(${i},1)">↓</button><button class="danger" onclick="removeItem(${i})">✕</button></div>`; }).join('') || '<p class="muted">Empty playlist. Add media below.</p>'}</div>
    <div class="card row"><select id="addMedia" class="grow">${media.map((m) => `<option value="${m.id}">${esc(m.name)} (${m.type})</option>`).join('')}</select><button onclick="addItem()">+ Add to playlist</button></div>`;
}
const editing_items = () => playlists.find((x) => x.id === editing).items;
function addItem() { const id = $('#addMedia').value; if (id) { editing_items().push({ mediaId: id, duration: 10 }); render(); } }
function removeItem(i) { editing_items().splice(i, 1); render(); }
function moveItem(i, d) { const a = editing_items(); if (a[i + d]) { [a[i], a[i + d]] = [a[i + d], a[i]]; render(); } }
async function savePlaylist() { const p = playlists.find((x) => x.id === editing); await api('/playlists/' + p.id, { method:'PUT', body:{ name: $('#plTitle').value, items: p.items } }); editing = null; load(); }
async function newPlaylist() { const p = await api('/playlists', { method:'POST', body:{ name: $('#plName').value } }); await load(); editing = p.id; render(); }
async function delPlaylist(id) { if (confirm('Delete playlist?')) { await api('/playlists/' + id, { method:'DELETE' }); load(); } }

if (token) start(); else showLogin();
</script>
</body>
</html>
