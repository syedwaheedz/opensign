name: Release APK

# Runs after a pull request is merged into main.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set; APK will be signed with the debug key."
          fi

      - name: Build release APK
        working-directory: player
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: cp player/app/build/outputs/apk/release/app-release.apk opensign-player-0.1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: opensign-player-apk
          path: opensign-player-*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" opensign-player-*.apk \
            --title "OpenSign Player 0.1.${{ github.run_number }}" \
            --notes "Built from PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}" \
            --target "${{ github.event.pull_request.merge_commit_sha }}"
